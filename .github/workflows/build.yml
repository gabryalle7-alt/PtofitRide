name: Build ProfitRide APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Create project files with Python
        run: |
          python3 - <<'PYEOF'
          import os

          def w(path, text):
              directory = os.path.dirname(path)
              if directory:
                  os.makedirs(directory, exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(text.strip() + '\n')

          w('settings.gradle', '''
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ProfitRide"
          include ':app'
          ''')

          w('build.gradle', '''
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          ''')

          w('app/build.gradle', '''
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'ro.profitride'
              compileSdk 34
              defaultConfig {
                  applicationId "ro.profitride"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          ''')

          w('app/src/main/AndroidManifest.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="ProfitRide"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".SettingsActivity"/>
                  <service
                      android:name=".OfferReader"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>
              </application>
          </manifest>
          ''')

          w('app/src/main/res/xml/accessibility_service_config.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/acc_desc"/>
          ''')

          w('app/src/main/res/values/strings.xml', '''
          <resources>
              <string name="app_name">ProfitRide</string>
              <string name="acc_desc">Citeste ofertele Bolt/Uber pentru a calcula profitul curselor</string>
          </resources>
          ''')

          w('app/src/main/res/layout/activity_main.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent">
              <LinearLayout android:orientation="vertical" android:padding="16dp"
                  android:layout_width="match_parent" android:layout_height="wrap_content">
                  <TextView android:text="ProfitRide - calculator curse"
                      android:textStyle="bold" android:textSize="18sp"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  <TextView android:text="Km pana la preluare" android:layout_marginTop="12dp"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  <EditText android:id="@+id/etPickup" android:inputType="numberDecimal"
                      android:hint="0.0" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  <TextView android:text="Km cursa (cu pasager)" android:layout_marginTop="8dp"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  <EditText android:id="@+id/etTrip" android:inputType="numberDecimal"
                      android:hint="0.0" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  <TextView android:text="Tarif oferit (RON)" android:layout_marginTop="8dp"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  <EditText android:id="@+id/etPrice" android:inputType="numberDecimal"
                      android:hint="0.0" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  <Button android:id="@+id/btnCalc" android:text="Calculeaza" android:layout_marginTop="12dp"
                      android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  <TextView android:id="@+id/tvResult" android:layout_marginTop="12dp"
                      android:textSize="15sp" android:fontFamily="monospace"
                      android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  <Button android:id="@+id/btnSettings" android:text="Setari costuri"
                      android:layout_marginTop="16dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  <Button android:id="@+id/btnAccessibility" android:text="Activeaza citirea automata"
                      android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  <Button android:id="@+id/btnOverlay" android:text="Permite afisare peste alte aplicatii"
                      android:layout_width="match_parent" android:layout_height="wrap_content"/>
              </LinearLayout>
          </ScrollView>
          ''')

          w('app/src/main/res/layout/activity_settings.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent">
              <LinearLayout android:orientation="vertical" android:padding="16dp"
                  android:layout_width="match_parent" android:layout_height="wrap_content">
                  <TextView android:text="Pret benzina (RON/L)"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  <EditText android:id="@+id/etFuelPrice" android:inputType="numberDecimal"
                      android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  <TextView android:text="Consum (L/100km)" android:layout_marginTop="8dp"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  <EditText android:id="@+id/etConsumption" android:inputType="numberDecimal"
                      android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  <TextView android:text="Comision platforma (%)" android:layout_marginTop="8dp"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  <EditText android:id="@+id/etCommission" android:inputType="numberDecimal"
                      android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  <TextView android:text="Cost uzura (RON/km)" android:layout_marginTop="8dp"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  <EditText android:id="@+id/etExtraCost" android:inputType="numberDecimal"
                      android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  <TextView android:text="Prag minim acceptare (RON/km)" android:layout_marginTop="8dp"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  <EditText android:id="@+id/etMinPerKm" android:inputType="numberDecimal"
                      android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  <Button android:id="@+id/btnSave" android:text="Salveaza" android:layout_marginTop="16dp"
                      android:layout_width="match_parent" android:layout_height="wrap_content"/>
              </LinearLayout>
          </ScrollView>
          ''')

          w('app/src/main/java/ro/profitride/Calc.kt', '''
          package ro.profitride

          import android.content.Context
          import android.graphics.Color

          object Calc {
              data class Result(val text: String, val color: Int, val profitPerKm: Float)

              fun compute(ctx: Context, pickupKm: Float, tripKm: Float, price: Float): Result {
                  val p = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val fuelPrice = p.getFloat("fuelPrice", 7.5f)
                  val consumption = p.getFloat("consumption", 7f)
                  val commission = p.getFloat("commission", 20f)
                  val extraCostPerKm = p.getFloat("extraCost", 0.5f)
                  val minPerKm = p.getFloat("minPerKm", 2.5f)

                  val totalKm = pickupKm + tripKm
                  val commissionCut = price * commission / 100f
                  val fuelCost = totalKm / 100f * consumption * fuelPrice
                  val extraCost = totalKm * extraCostPerKm
                  val net = price - commissionCut - fuelCost - extraCost
                  val perKm = if (totalKm > 0) net / totalKm else 0f

                  val color = when {
                      perKm >= minPerKm * 1.2f -> Color.parseColor("#2E7D32")
                      perKm >= minPerKm -> Color.parseColor("#F9A825")
                      else -> Color.parseColor("#C62828")
                  }
                  val text = """
                      Total km: %.1f
                      Comision: %.2f RON
                      Combustibil: %.2f RON
                      Alte costuri: %.2f RON
                      ------------------------
                      Profit net: %.2f RON
                      Profit/km: %.2f RON
                      Prag minim: %.2f RON/km
                  """.trimIndent().format(totalKm, commissionCut, fuelCost, extraCost, net, perKm, minPerKm)
                  return Result(text, color, perKm)
              }
          }
          ''')

          w('app/src/main/java/ro/profitride/MainActivity.kt', '''
          package ro.profitride

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val etPickup = findViewById<EditText>(R.id.etPickup)
                  val etTrip = findViewById<EditText>(R.id.etTrip)
                  val etPrice = findViewById<EditText>(R.id.etPrice)
                  val tvResult = findViewById<TextView>(R.id.tvResult)

                  val offers = getSharedPreferences("offers", MODE_PRIVATE)
                  if (offers.getBoolean("fresh", false)) {
                      etPickup.setText(offers.getFloat("pickupKm", 0f).toString())
                      etTrip.setText(offers.getFloat("tripKm", 0f).toString())
                      etPrice.setText(offers.getFloat("price", 0f).toString())
                      offers.edit().putBoolean("fresh", false).apply()
                  }

                  findViewById<Button>(R.id.btnCalc).setOnClickListener {
                      val pp = etPickup.text.toString().toFloatOrNull() ?: 0f
                      val t = etTrip.text.toString().toFloatOrNull() ?: 0f
                      val pr = etPrice.text.toString().toFloatOrNull() ?: 0f
                      val r = Calc.compute(this, pp, t, pr)
                      tvResult.text = r.text
                      tvResult.setTextColor(r.color)
                  }

                  findViewById<Button>(R.id.btnSettings).setOnClickListener {
                      startActivity(Intent(this, SettingsActivity::class.java))
                  }
                  findViewById<Button>(R.id.btnAccessibility).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  findViewById<Button>(R.id.btnOverlay).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
              }
          }
          ''')

          w('app/src/main/java/ro/profitride/SettingsActivity.kt', '''
          package ro.profitride

          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import androidx.appcompat.app.AppCompatActivity

          class SettingsActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_settings)
                  val p = getSharedPreferences("cfg", MODE_PRIVATE)

                  val etFuel = findViewById<EditText>(R.id.etFuelPrice)
                  val etCons = findViewById<EditText>(R.id.etConsumption)
                  val etComm = findViewById<EditText>(R.id.etCommission)
                  val etExtra = findViewById<EditText>(R.id.etExtraCost)
                  val etMin = findViewById<EditText>(R.id.etMinPerKm)

                  etFuel.setText(p.getFloat("fuelPrice", 7.5f).toString())
                  etCons.setText(p.getFloat("consumption", 7f).toString())
                  etComm.setText(p.getFloat("commission", 20f).toString())
                  etExtra.setText(p.getFloat("extraCost", 0.5f).toString())
                  etMin.setText(p.getFloat("minPerKm", 2.5f).toString())

                  findViewById<Button>(R.id.btnSave).setOnClickListener {
                      p.edit()
                          .putFloat("fuelPrice", etFuel.text.toString().toFloatOrNull() ?: 7.5f)
                          .putFloat("consumption", etCons.text.toString().toFloatOrNull() ?: 7f)
                          .putFloat("commission", etComm.text.toString().toFloatOrNull() ?: 20f)
                          .putFloat("extraCost", etExtra.text.toString().toFloatOrNull() ?: 0.5f)
                          .putFloat("minPerKm", etMin.text.toString().toFloatOrNull() ?: 2.5f)
                          .apply()
                      finish()
                  }
              }
          }
          ''')

          w('app/src/main/java/ro/profitride/OfferReader.kt', '''
          package ro.profitride

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.TextView

          class OfferReader : AccessibilityService() {
              private var overlay: View? = null
              private lateinit var wm: WindowManager

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  val root = rootInActiveWindow ?: return
                  val pkg = root.packageName?.toString() ?: return
                  if (!(pkg.contains("bolt") || pkg.contains("uber") || pkg.contains("free"))) return

                  val sb = StringBuilder()
                  collect(root, sb)
                  val text = sb.toString()
                  val price = Regex("""(\d+[.,]?\d*)\s*(RON|lei)""", RegexOption.IGNORE_CASE)
                      .find(text)?.groupValues?.get(1)?.replace(",", ".")?.toFloatOrNull()
                  val kms = Regex("""(\d+[.,]?\d*)\s*km""", RegexOption.IGNORE_CASE)
                      .findAll(text).map { it.groupValues[1].replace(",", ".").toFloat() }.toList()

                  if (price != null && kms.isNotEmpty()) {
                      val tripKm = kms.getOrNull(0) ?: 0f
                      val pickupKm = kms.getOrNull(1) ?: 0f
                      val result = Calc.compute(this, pickupKm, tripKm, price)
                      val prefs = getSharedPreferences("offers", Context.MODE_PRIVATE)
                      prefs.edit().putFloat("pickupKm", pickupKm).putFloat("tripKm", tripKm)
                          .putFloat("price", price).putBoolean("fresh", true).apply()
                      showOverlay(result)
                  }
              }

              private fun collect(node: AccessibilityNodeInfo?, sb: StringBuilder) {
                  if (node == null) return
                  node.text?.let { sb.append(it).append('\n') }
                  for (i in 0 until node.childCount) collect(node.getChild(i), sb)
              }

              private fun showOverlay(r: Calc.Result) {
                  overlay?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  val tv = TextView(this).apply {
                      text = r.text
                      setBackgroundColor(Color.parseColor("#DD000000"))
                      setTextColor(r.color)
                      setPadding(30, 30, 30, 30)
                      textSize = 13f
                  }
                  val type = if (Build.VERSION.SDK_INT >= 26)
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 20; y = 200
                  }
                  try { wm.addView(tv, params); overlay = tv } catch (_: Exception) {}
              }

              override fun onInterrupt() {}
          }
          ''')
          PYEOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfitRide-APK
          path: app/build/outputs/apk/debug/app-debug.apk
